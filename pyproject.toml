# Tell pip which tool builds and installs this Python package.
[build-system]
# Version 77 supports the standard license name and bundled license file below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Basic project details, including the minimum supported Python version.
[project]
name = "outreach-agent"
version = "0.3.0"
description = "Goal-driven outreach with sourced research, relationship memory, and human approval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",  # Handle HTTP requests and generate API documentation.
    "pydantic>=2.9,<3",  # Define and validate the application's data records.
    "uvicorn>=0.30,<1",  # Run the web server that serves the FastAPI application.
    "openai>=2.11,<3",  # Make structured model calls through the shared client.
    "langgraph>=1.0,<2",  # Run workflow steps through an explicit state graph.
    "httpx>=0.27,<1",  # Call search and Gmail through replaceable HTTP adapters.
    "sqlalchemy>=2.0,<3",  # Store relationship records in SQLite or PostgreSQL.
    "langgraph-checkpoint-sqlite>=3,<4",  # Resume local runs after a restart.
]

# Start the service; users interact through Telegram or the dashboard.
[project.scripts]
outreach-server = "app.main:main"

# The extra packages included by pip install -e '.[dev]' support local tests.
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",  # Discover and run the automated checks in tests/.
    "httpx>=0.27,<1",  # Support HTTP request simulation in the API tests.
]
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
    "langgraph-checkpoint-postgres>=3,<4",
]

# Include the application and its subpackages when installing the project.
[tool.setuptools.packages.find]
include = ["app", "app.*", "evals", "evals.*"]

[tool.setuptools.package-data]
evals = ["cases.json"]

# Look for tests in tests/ and use concise output when running pytest.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
